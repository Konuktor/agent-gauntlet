# AgentGauntlet — Render Blueprint
#
# One web service and one Postgres. There is deliberately no separate background
# worker: Render has no free plan for one, so `GAUNTLET_DEPLOY_MODE=single` hosts
# the existing worker runtime inside the web service's process. The split
# topology is still the default everywhere else — see docs/RENDER_NOTES.md.
#
# Nothing secret is committed here. SOLARI_API_KEY is prompted for on first
# apply; GAUNTLET_RUN_TOKEN is generated by Render.

services:
  - type: web
    name: agent-gauntlet
    runtime: node
    plan: free
    region: oregon
    # Migrations cannot run in a pre-deploy step on the free plan, so the start
    # command applies them before the server listens and exits non-zero if they
    # fail — which makes Render mark the deploy unhealthy instead of serving
    # traffic against a half-migrated schema.
    buildCommand: pnpm render:build
    startCommand: pnpm render:start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # No maxShutdownDelaySeconds: Render rejects it on the free plan
    # ("max shutdown delay is not supported for free tier services"), which
    # pins the window at the 30s default. The server drains the worker inside a
    # 20s budget so in-flight Solari sessions are released rather than
    # orphaned; anything still running is requeued by the reclaim logic.

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # No NODE_OPTIONS here on purpose. Render applies service env vars to the
      # BUILD as well as the run, and `next build` OOMs under a 384 MB heap.
      # The runtime cap lives in the start command instead — see `render:start`.
      - key: GAUNTLET_DEPLOY_MODE
        value: single

      - key: DATABASE_URL
        fromDatabase:
          name: agent-gauntlet-db
          property: connectionString

      # Entered by the deployer on first apply, never stored in git.
      # Leave it blank to deploy a demo-only instance: the seeded dashboard
      # works, and starting a real run is simply unavailable.
      - key: SOLARI_API_KEY
        sync: false

      # The access code for starting runs that spend credits. Render generates
      # it; read it from the dashboard and keep it. Without this a public
      # deployment holding a Solari key refuses to boot.
      - key: GAUNTLET_RUN_TOKEN
        generateValue: true

      # Solari's Free plan allows 3 concurrent browser sessions and 1 sandbox.
      # A 429 is not retryable, so staying under the cap matters.
      - key: GAUNTLET_MAX_CONCURRENCY
        value: "3"
      - key: GAUNTLET_MAX_SANDBOXES
        value: "1"
      - key: GAUNTLET_MAX_RUNS_PER_SUITE
        value: "16"

      - key: LOG_LEVEL
        value: info

databases:
  - name: agent-gauntlet-db
    plan: free
    databaseName: gauntlet
    user: gauntlet
    region: oregon
    postgresMajorVersion: "17"
