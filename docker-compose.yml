services:
  postgres:
    image: postgres:17-alpine
    container_name: agent-gauntlet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gauntlet
      POSTGRES_PASSWORD: gauntlet
      POSTGRES_DB: gauntlet
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gauntlet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gauntlet -d gauntlet"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  gauntlet-pgdata:
