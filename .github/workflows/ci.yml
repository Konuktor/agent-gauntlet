# Pull-request and default-branch verification.
#
# Everything here runs on free infrastructure: local Chromium, a Postgres
# service container, and no Solari credentials. Nothing in this workflow can
# spend a browser credit, which is what makes it safe to run on every PR.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: this workflow reads code and writes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gauntlet
          POSTGRES_PASSWORD: gauntlet
          POSTGRES_DB: gauntlet
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U gauntlet"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://gauntlet:gauntlet@localhost:5433/gauntlet

    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm db:migrate
      - run: pnpm --filter @gauntlet/local-runtime exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:seed
      - run: pnpm test:e2e

      # Boots the real production artifacts as two separate processes and
      # asserts the promises the platform depends on.
      - run: pnpm test:deploy

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
